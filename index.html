<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Snack Market Pro</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#fff8e1;
}

/* ================= LOGIN PAGE ================= */

.auth-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff9800,#ff5722);
}

.auth-box{
  background:white;
  width:350px;
  padding:35px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  animation:show .5s;
}

@keyframes show{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.auth-box h1{
  text-align:center;
  margin-bottom:25px;
  color:#ff5722;
}

.auth-box input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

.auth-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#ff5722;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

.auth-box button:hover{
  background:#e64a19;
}

.google-btn{
  background:#4285F4 !important;
}

.switch{
  text-align:center;
  margin-top:15px;
  color:#ff5722;
  cursor:pointer;
}

/* ================= HEADER ================= */

header{
  background:#ff5722;
  color:white;
  padding:20px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:999;
}

.top-bar{
  margin-top:10px;
}

.logout-btn{
  width:auto;
  padding:8px 15px;
  background:#333;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* ================= LAYOUT ================= */

.container{
  display:flex;
  flex-wrap:wrap;
}

/* ================= PRODUCTS ================= */

.products{
  flex:2;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  padding:20px;
}

.product{
  background:white;
  width:230px;
  margin:15px;
  padding:15px;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  text-align:center;
  transition:0.3s;
}

.product:hover{
  transform:translateY(-5px);
}

.product img{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:10px;
}

.product button{
  margin-top:10px;
  width:100%;
  background:#ff5722;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.product button:hover{
  background:#e64a19;
}

/* ================= CART ================= */

.cart{
  flex:1;
  min-width:300px;
  background:#fff3e0;
  padding:20px;
}

.cart h2{
  margin-bottom:15px;
}

.cart-item{
  background:white;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
}

.qty{
  display:flex;
  align-items:center;
  margin-top:8px;
}

.qty button{
  width:30px;
  height:30px;
  border:none;
  background:#ff5722;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

.qty span{
  margin:0 10px;
}

.discount{
  margin-top:15px;
}

.discount input{
  width:100%;
  padding:10px;
  margin-top:5px;
}

.total{
  margin-top:20px;
  font-size:22px;
  font-weight:bold;
}

.checkout{
  width:100%;
  margin-top:20px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#4CAF50;
  color:white;
  cursor:pointer;
}

.checkout:hover{
  background:#3e8e41;
}

/* ================= ADMIN PANEL ================= */

.admin-panel{
  background:white;
  margin:20px;
  padding:20px;
  border-radius:15px;
}

.admin-panel input{
  padding:10px;
  margin:5px;
}

.admin-panel button{
  padding:10px;
  border:none;
  background:#ff5722;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

.container{
  flex-direction:column;
}

}

</style>
</head>

<body>

<!-- ================= LOGIN PAGE ================= -->

<div class="auth-page" id="authPage">

<div class="auth-box">

<h1 id="formTitle">Member Login</h1>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<button class="google-btn" onclick="googleLogin()">
Login with Google
</button>

<div class="switch" onclick="toggleForm()">
No account? Click to Register
</div>

</div>
</div>

<!-- ================= SHOP PAGE ================= -->

<div id="shopPage" style="display:none;">

<header>

<h1>🛒 Super Snack Market Pro</h1>

<div class="top-bar">

Welcome:
<span id="userText"></span>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

</header>

<!-- ================= ADMIN DASHBOARD ================= -->

<div class="admin-panel" id="adminPanel" style="display:none;">

<h2>🛠 Admin Dashboard</h2>

<input type="text" id="newName" placeholder="Product Name">

<input type="number" id="newPrice" placeholder="Price">

<input type="text" id="newImage" placeholder="Image URL">

<button onclick="addProduct()">
Add Product
</button>

</div>

<div class="container">

<!-- PRODUCTS -->

<div class="products" id="products"></div>

<!-- CART -->

<div class="cart">

<h2>🛒 Shopping Cart</h2>

<div id="cartItems"></div>

<div class="discount">

Discount Code

<input type="text" id="coupon">

<button onclick="applyDiscount()">
Apply Discount
</button>

</div>

<div class="total">
Total: $<span id="total">0</span>
</div>

<button class="checkout" onclick="checkout()">
Checkout
</button>

</div>

</div>
</div>

<script>

/* ================= PRODUCTS ================= */

let products = [

{
name:"Crispy Potato Chips",
price:50,
image:"https://pic2.zhimg.com/v2-47835973f59119bfed8d0865dc3a9ff9_r.jpg"
},

{
name:"Dove Chocolate",
price:50,
image:"https://img.shopping.friday.tw/images/product/288/8640614/8640614_3_1.webp?288362"
},

{
name:"OREO Cookies",
price:45,
image:"https://img.jollybuy.com/S231109162347614/goods/14c52801f91842559c82a8231def1947_Q50.jpg"
},

{
name:"Classic Cola",
price:30,
image:"https://www.mashed.com/img/gallery/a-can-of-coca-cola-is-being-sold-for-over-300000/intro-1683831628.jpg"
}

];

/* ================= USER SYSTEM ================= */

let isLogin = true;

function toggleForm(){

isLogin = !isLogin;

document.getElementById("formTitle").innerText =
isLogin ? "Member Login" : "Member Register";

document.querySelector(".switch").innerText =
isLogin ?
"No account? Click to Register"
:
"Already have an account? Click to Login";

}

/* ================= REGISTER ================= */

function register(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

if(username === "" || password === ""){

alert("Please fill in all fields");

return;

}

localStorage.setItem(username,password);

alert("Registration Successful!");

toggleForm();

}

/* ================= LOGIN ================= */

function login(){

if(!isLogin){

register();

return;

}

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const saved =
localStorage.getItem(username);

if(saved === password){

localStorage.setItem("currentUser",username);

showShop(username);

}else{

alert("Incorrect username or password");

}

}

/* ================= GOOGLE LOGIN ================= */

function googleLogin(){

const username = "Google User";

localStorage.setItem("currentUser",username);

showShop(username);

}

/* ================= SHOW SHOP ================= */

function showShop(username){

document.getElementById("authPage").style.display =
"none";

document.getElementById("shopPage").style.display =
"block";

document.getElementById("userText").innerText =
username;

/* ADMIN ACCOUNT */

if(username === "admin"){

document.getElementById("adminPanel").style.display =
"block";

}

renderProducts();

loadCart();

}

/* ================= LOGOUT ================= */

function logout(){

localStorage.removeItem("currentUser");

location.reload();

}

/* ================= RENDER PRODUCTS ================= */

function renderProducts(){

const box =
document.getElementById("products");

box.innerHTML = "";

products.forEach((p,index)=>{

box.innerHTML += `

<div class="product">

<img src="${p.image}">

<h3>${p.name}</h3>

<p>$${p.price}</p>

<button onclick="addToCart(${index})">
Add to Cart
</button>

</div>

`;

});

}

/* ================= CART ================= */

let cart = [];

function addToCart(index){

const item = products[index];

const exist = cart.find(
p => p.name === item.name
);

if(exist){

exist.qty++;

}else{

cart.push({
...item,
qty:1
});

}

saveCart();

renderCart();

}

function renderCart(){

const cartBox =
document.getElementById("cartItems");

cartBox.innerHTML = "";

let total = 0;

cart.forEach((item,index)=>{

total += item.price * item.qty;

cartBox.innerHTML += `

<div class="cart-item">

<h4>${item.name}</h4>

<p>$${item.price}</p>

<div class="qty">

<button onclick="changeQty(${index},-1)">
-
</button>

<span>${item.qty}</span>

<button onclick="changeQty(${index},1)">
+
</button>

</div>

</div>

`;

});

/* DISCOUNT */

if(discount > 0){

total = total - total * discount;

}

document.getElementById("total").innerText =
total.toFixed(0);

}

function changeQty(index,num){

cart[index].qty += num;

if(cart[index].qty <= 0){

cart.splice(index,1);

}

saveCart();

renderCart();

}

/* ================= SAVE CART ================= */

function saveCart(){

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

}

function loadCart(){

const saved =
localStorage.getItem("cart");

if(saved){

cart = JSON.parse(saved);

renderCart();

}

}

/* ================= DISCOUNT ================= */

let discount = 0;

function applyDiscount(){

const code =
document.getElementById("coupon").value;

if(code === "SNACK10"){

discount = 0.1;

alert("10% discount applied!");

}else if(code === "VIP20"){

discount = 0.2;

alert("20% discount applied!");

}else{

discount = 0;

alert("Invalid discount code");

}

renderCart();

}

/* ================= CHECKOUT ================= */

function checkout(){

if(cart.length === 0){

alert("Your cart is empty");

return;

}

alert("Payment Successful 🎉");

cart = [];

saveCart();

renderCart();

}

/* ================= ADD PRODUCT ================= */

function addProduct(){

const name =
document.getElementById("newName").value;

const price =
document.getElementById("newPrice").value;

const image =
document.getElementById("newImage").value;

if(name === "" || price === "" || image === ""){

alert("Please complete all product information");

return;

}

products.push({
name,
price,
image
});

renderProducts();

alert("Product Added Successfully");

}

/* ================= AUTO LOGIN ================= */

const currentUser =
localStorage.getItem("currentUser");

if(currentUser){

showShop(currentUser);

}

</script>

</body>
</html>
