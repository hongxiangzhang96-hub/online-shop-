

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>超級零食超市 PRO版</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#fff8e1;
}

header{
  background:#ff5722;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  display:flex;
  flex-wrap:wrap;
}

.products{
  flex:2;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  padding:20px;
}

.product{
  background:white;
  width:220px;
  margin:15px;
  padding:15px;
  border-radius:15px;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
  text-align:center;
  transition:0.3s;
}

.product:hover{
  transform:scale(1.05);
}

.product img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}

button{
  background:#ff5722;
  color:white;
  border:none;
  padding:6px;
  border-radius:8px;
  cursor:pointer;
  margin-top:5px;
}

button:hover{
  background:#e64a19;
}

.cart{
  flex:1;
  background:#fff3e0;
  padding:20px;
  min-width:280px;
}

.cart-item{
  margin-bottom:10px;
}

.total{
  font-weight:bold;
  margin-top:10px;
  font-size:18px;
}

.checkout{
  background:#4CAF50;
  width:100%;
  margin-top:10px;
}

.checkout:hover{
  background:#3e8e41;
}

@media(max-width:768px){
  .container{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛒 超級零食超市 PRO</h1>
</header>

<div class="container">

<div class="products">

<!-- 香脆薯片 -->
<div class="product">
  <img src="https://pic2.zhimg.com/v2-47835973f59119bfed8d0865dc3a9ff9_r.jpg">
  <h3>香脆薯片</h3>
  <p>$50</p>
  <button onclick="addToCart('香脆薯片',50)">加入購物車</button>
</div>

<!-- 巧克力 -->
<div class="product">
  <img src="https://images.unsplash.com/photo-1582176604856-e824b4736522">
  <h3>巧克力</h3>
  <p>$40</p>
  <button onclick="addToCart('巧克力',40)">加入購物車</button>
</div>

<!-- 🆕 減糖 OREO -->
<div class="product">
  <img src="image.png">
  <h3>減糖OREO餅乾</h3>
  <p>$45</p>
  <button onclick="addToCart('減糖OREO餅乾',45)">加入購物車</button>
</div>

<!-- 經典可樂 -->
<div class="product">
  <img src="cola.png">
  <h3>經典可樂</h3>
  <p>$35</p>
  <button onclick="addToCart('經典可樂',35)">加入購物車</button>
</div>

<!-- 超人氣零食 -->
<div class="product">
  <img src="https://img.alicdn.com/imgextra/i1/2217937106238/O1CN01Mb1Ud71vx3jwXQnPP_!!2217937106238.jpg">
  <h3>超人氣零食</h3>
  <p>$60</p>
  <button onclick="addToCart('超人氣零食',60)">加入購物車</button>
</div>

<!-- 香甜餅乾 -->
<div class="product">
  <img src="https://imgservice.suning.cn/uimg1/b2c/image/dmxOHawNX4Ilj59bipUcRA.jpg">
  <h3>香甜餅乾</h3>
  <p>$55</p>
  <button onclick="addToCart('香甜餅乾',55)">加入購物車</button>
</div>

</div>

<div class="cart">
  <h2>🛒 購物車</h2>
  <div id="cartItems"></div>
  <div class="total">總金額: $<span id="total">0</span></div>
  <div id="discountInfo"></div>
  <button class="checkout" onclick="checkout()">結帳</button>
</div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

function saveCart(){
  localStorage.setItem("cart",JSON.stringify(cart));
}

function addToCart(name, price){
  if(cart[name]){
    cart[name].qty++;
  }else{
    cart[name]={price:price,qty:1};
  }
  saveCart();
  renderCart();
}

function changeQty(name, amount){
  cart[name].qty += amount;
  if(cart[name].qty <=0){
    delete cart[name];
  }
  saveCart();
  renderCart();
}

function renderCart(){
  const cartItems=document.getElementById("cartItems");
  cartItems.innerHTML="";
  let total=0;

  for(let name in cart){
    let item=cart[name];
    total += item.price*item.qty;

    cartItems.innerHTML+=`
      <div class="cart-item">
        ${name} ($${item.price}) x ${item.qty}
        <button onclick="changeQty('${name}',1)">+</button>
        <button onclick="changeQty('${name}',-1)">-</button>
      </div>
    `;
  }

  let finalTotal=total;
  let discountText="";

  if(total>=300){
    finalTotal=total*0.9;
    discountText="🎉 滿300自動打9折！";
  }

  document.getElementById("total").innerText=finalTotal.toFixed(0);
  document.getElementById("discountInfo").innerText=discountText;
}

function checkout(){
  if(Object.keys(cart).length===0){
    alert("購物車是空的！");
  }else{
    alert("付款成功 🎉");
    cart={};
    saveCart();
    renderCart();
  }
}

renderCart();
</script>

</body>
</html>
