

 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>我的零食店</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#fff8e1;
  text-align:center;
}

header{
  background:#ff9800;
  color:white;
  padding:20px;
}

#cart{
  font-size:18px;
  margin-top:10px;
}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  padding:20px;
}

.product{
  background:white;
  width:220px;
  margin:15px;
  padding:15px;
  border-radius:15px;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

button{
  background:#ff9800;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  margin-top:10px;
  width:100%;
}

button:hover{
  background:#e68900;
}
</style>
</head>

<body>

<header>
  <h1>🍭 我的零食商店</h1>
  <div id="cart">購物車：0 件</div>
</header>

<div class="products">

  <!-- 用圖片連結 -->
  <div class="product">
    <img src="https://img.pchome.com.tw/cs/items/DBAEF0A900J4FWZ/l000004_1754983288.jpg">
    <h3>洋芋片</h3>
    <p>$50</p>
    <button onclick="addToCart()">加入購物車</button>
  </div>

  <!-- 用本地圖片（自己下載放資料夾） -->
  <div class="product">
    <img src="snack1.jpg">
    <h3>巧克力</h3>
    <p>$40</p>
    <button onclick="addToCart()">加入購物車</button>
  </div>

  <!-- 你可以一直複製下面這塊新增商品 -->
  <div class="product">
    <img src="snack2.jpg">
    <h3>餅乾</h3>
    <p>$35</p>
    <button onclick="addToCart()">加入購物車</button>
  </div>

</div>

<script>
let cart = 0;

function addToCart(){
  cart++;
  document.getElementById("cart").innerText =
  "購物車：" + cart + " 件";
}
</script>

</body>
</html>
