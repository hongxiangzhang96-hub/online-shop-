
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>超級零食超市</title>

<style>
body{
  font-family: Arial;
  margin:0;
  background:#fff8e1;
}

header{
  background:#ff5722;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  display:flex;
  flex-wrap:wrap;
}

.products{
  flex:2;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  padding:20px;
}

.product{
  background:white;
  width:220px;
  margin:15px;
  padding:15px;
  border-radius:15px;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
  text-align:center;
}

.product img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
}

button{
  background:#ff5722;
  color:white;
  border:none;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
  width:100%;
}

button:hover{
  background:#e64a19;
}

.cart{
  flex:1;
  background:#fff3e0;
  padding:20px;
  min-width:250px;
}

.cart-item{
  margin-bottom:8px;
}

.total{
  font-weight:bold;
  margin-top:10px;
  font-size:18px;
}

.discount{
  margin-top:10px;
}

.checkout{
  background:#4CAF50;
}

.checkout:hover{
  background:#3e8e41;
}

@media(max-width:768px){
  .container{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <h1>🛒 超級零食超市</h1>
</header>

<div class="container">

<div class="products">

<!-- 薯片 -->
<div class="product">
  <img src="https://pic2.zhimg.com/v2-47835973f59119bfed8d0865dc3a9ff9_r.jpg">
  <h3>香脆薯片</h3>
  <p>$50</p>
  <button onclick="addToCart('香脆薯片',50)">加入購物車</button>
</div>

<!-- Dove巧克力 -->
<div class="product">
  <img src="image.png">
  <h3>Dove 巧克力</h3>
  <p>$50</p>
  <button onclick="addToCart('Dove巧克力',50)">加入購物車</button>
</div>

<!-- OREO餅乾 -->
<div class="product">
  <img src="oreo.png">
  <h3>減糖OREO餅乾</h3>
  <p>$45</p>
  <button onclick="addToCart('減糖OREO餅乾',45)">加入購物車</button>
</div>

<!-- 可樂 -->
<div class="product">
  <img src="https://www.mashed.com/img/gallery/a-can-of-coca-cola-is-being-sold-for-over-300000/intro-1683831628.jpg">
  <h3>經典可樂</h3>
  <p>$30</p>
  <button onclick="addToCart('經典可樂',30)">加入購物車</button>
</div>
</div>

<div class="cart">
  <h2>🛒 購物車</h2>
  <div id="cartItems"></div>

  <div class="discount">
    折扣碼:
    <input type="text" id="coupon">
    <button onclick="applyDiscount()">套用</button>
  </div>

  <div class="total">
    總金額: $<span id="total">0</span>
  </div>

  <button class="checkout" onclick="checkout()">結帳</button>
</div>

</div>

<script>
let total = 0;
let discount = 0;

function addToCart(name, price){
  const cartItems = document.getElementById("cartItems");

  const item = document.createElement("div");
  item.className = "cart-item";
  item.innerHTML = name + " - $" + price +
    " <button onclick='removeItem(this,"+price+")'>刪除</button>";

  cartItems.appendChild(item);

  total += price;
  updateTotal();
}

function removeItem(button, price){
  button.parentElement.remove();
  total -= price;
  updateTotal();
}

function applyDiscount(){
  const code = document.getElementById("coupon").value;

  if(code === "SNACK10"){
    discount = 0.1;
    alert("折扣成功！打9折");
  } else {
    discount = 0;
    alert("折扣碼錯誤");
  }

  updateTotal();
}

function updateTotal(){
  const finalTotal = total - (total * discount);
  document.getElementById("total").innerText = finalTotal.toFixed(0);
}

function checkout(){
  if(total === 0){
    alert("購物車是空的！");
  } else {
    alert("感謝購買！付款成功 🎉");
    location.reload();
  }
}
</script>

</body>
</html>
